services:
  abx:
    build: .
    container_name: abx-blind-test
    ports:
      # 左侧为宿主机端口，可用 PORT 环境变量覆盖，例如 PORT=8080 docker compose up
      - "${PORT:-3000}:3000"
    volumes:
      # 音频与会话数据仅保存在本机该命名卷中
      - abx-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  abx-data:
